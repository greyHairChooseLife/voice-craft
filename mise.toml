# voice-craft tasks / env
# 게임 측(bot) · 음성 측(voice) 공통 작업 진입점.
# 도구 버전 핀([tools])은 빌드 단계(A3~)에서 추가한다.

[env]
# BW 1.16.1 전용 Wine prefix. 모든 wine task가 상속한다.
# Wine 11+는 wow64 단일 빌드라 win32 prefix를 못 만든다 → win64로 두고
# wow64가 32-bit BW를 실행한다 (ADR-001).
WINEPREFIX = "{{env.HOME}}/.wine-bw"
WINEARCH = "win64"
# BW 패키지 압축 해제 위치.
BW_DIR = "{{env.HOME}}/sc-bw-1161"
# 봇 소스 디렉터리 (Docker 빌드 mount 대상).
BOT_DIR = "{{config_root}}/bot"
# 음성 서비스(Python) 디렉터리 (MVP-B).
VOICE_DIR = "{{config_root}}/voice"
# 봇 빌드용 Docker 이미지 태그.
BOT_IMAGE = "voice-craft-bot-build"
# Wine virtual desktop 크기 (i3 윈도우 모드용).
# BW 1.16.1은 내부 렌더가 640x480 고정이라 창을 키워도 게임은 안 커지고 검은 여백만
# 늘어난다 → 창을 게임 크기에 맞춘다.
WINE_VDESKTOP = "640x480"

# --- A1: Wine + BW 1.16.1 (게임 확보 근거는 ADR-011) ---

[tasks.bw-download]
description = "BW 1.16.1 + BWAPI 4.4.0 패키지 다운로드·압축 해제 (멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p "$BW_DIR"
cd "$BW_DIR"
if [ ! -f scbw_bwapi440.zip ]; then
  curl -L -o scbw_bwapi440.zip \
    https://davechurchill.ca/starcraft/files/startcraft/scbw_bwapi440.zip
fi
if ! find . -iname StarCraft.exe -print -quit | grep -q .; then
  unzip -o scbw_bwapi440.zip
fi
echo "StarCraft.exe 위치:"
find "$BW_DIR" -iname StarCraft.exe
'''

[tasks.system-setup]
description = "Wine 등 시스템 패키지 설치 (sudo 필요 — '! mise run system-setup'으로 실행)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# [multilib]이 활성화되어 있어야 32-bit wine이 설치된다.
sudo pacman -S --needed wine wine-mono winetricks
'''

[tasks.wine-init]
description = "전용 WINEPREFIX 초기화 (win64/wow64, 멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ ! -d "$WINEPREFIX" ]; then
  wineboot --init
else
  echo "WINEPREFIX 이미 존재: $WINEPREFIX"
fi
'''

[tasks.wine-vdesktop]
description = "Wine virtual desktop 활성화 → BW를 i3가 다루는 윈도우 모드로 (멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Explorer\Desktop = "Default" 로 두면 모든 wine 앱이 Default 가상 데스크톱 창에 뜬다.
# Desktops\Default 에 창 크기를 지정한다.
wine reg add 'HKCU\Software\Wine\Explorer' /v Desktop /d Default /f
wine reg add 'HKCU\Software\Wine\Explorer\Desktops' /v Default /d "$WINE_VDESKTOP" /f
echo "virtual desktop = $WINE_VDESKTOP"
'''

[tasks.bw-run]
description = "BW 단독 실행 → 메인 메뉴 확인 (A1 통과 조건)"
depends = ["bw-download", "wine-vdesktop"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
sc_dir=$(dirname "$(find "$BW_DIR" -iname StarCraft.exe -print -quit)")
cd "$sc_dir"
wine StarCraft.exe
'''

# --- A2: injectory로 BWAPI 인젝션 검증 (봇 없음, ADR-012) ---
# BWAPI 공식 배포는 ExampleAIModule 소스만 주고 빌드된 .dll이 없다 → A2는
# "Wine에서 BWAPI 주입 자체가 되는가"만 격리 검증한다. 실제 봇 동작은 A3.

[tasks.bw-bwapi]
description = "injectory로 BWAPI 주입해 BW 실행 → 크래시 없이 BWAPI 로드 확인 (A2 검증)"
# 통합 테스트(게임/봇/음성)에선 run-game 으로 부른다.
alias = "run-game"
depends = ["bw-download"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$BW_DIR"
# injectory가 BWAPI.dll + WMode.dll 을 StarCraft.exe에 주입 (--verbose로 주입 로그).
# 봇은 bwapi.ini의 ai= 가 비어 있어 로드되지 않는다 (인젝션 자체만 검증).
# BWAPI 오버레이/로그는 매치 진입 후에 나타나므로 single-player 게임까지 들어가 확인.
wine injectory_x86.exe --verbose --launch StarCraft.exe \
  --inject bwapi-data/BWAPI.dll WMode.dll
'''

# --- A3: BWAPI Client API 봇 .exe (MinGW Docker 빌드, ADR-014) ---
# 봇은 AIModule DLL이 아니라 독립 .exe. 게임(bw-bwapi로 주입)과 같은 Wine
# prefix에서 실행돼 shared memory로 BWAPI에 붙는다. 빌드는 컨테이너 안에서만,
# 호스트엔 MinGW 미설치.

[tasks.bot-image]
description = "봇 빌드용 Docker 이미지 빌드 (Debian + MinGW, 멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker build -t "$BOT_IMAGE" "$BOT_DIR"
'''

[tasks.bot-build]
description = "봇 .exe 를 컨테이너에서 크로스컴파일 → bot/build/voice-craft-bot.exe"
depends = ["bot-image"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# --user 로 호스트 UID 매핑 (산출물이 root 소유로 안 생기게).
docker run --rm \
  --user "$(id -u):$(id -g)" \
  -v "$BOT_DIR:/work" -w /work \
  "$BOT_IMAGE" sh -c '
    cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-toolchain.cmake -DCMAKE_BUILD_TYPE=Release
    cmake --build build -j
  '
echo "산출물:"
ls -la "$BOT_DIR/build/voice-craft-bot.exe"
'''

[tasks.bot-run]
description = "봇 .exe 실행 (게임이 매치 진입한 뒤 별도 터미널에서 — A3 검증)"
# 통합 테스트(게임/봇/음성)에선 run-bot 으로 부른다.
alias = "run-bot"
# build/ 는 git-ignore 라 새 worktree 엔 .exe 가 없다 → 실행 전 빌드 보장.
depends = ["bot-build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
# 게임과 동일 WINEPREFIX([env])에서 실행해야 shared memory를 공유한다.
# 게임을 먼저 mise run bw-bwapi 로 띄우고 매치에 진입한 상태여야 한다.
wine "$BOT_DIR/build/voice-craft-bot.exe"
'''

# --- 음성 서비스 (asyncio TCP :5000 + PTT 캡처 + STT, ADR-015~019) ---
# Python 의존성은 uv + 프로젝트 로컬 venv(voice/.venv)로 격리한다. B2 부터
# voice-setup 이 음성 경로 의존성을 설치한다 — pynput·sounddevice·numpy
# (PTT 캡처) + faster-whisper (STT, B3).
# sounddevice 는 PortAudio 시스템 패키지가 필요할 수 있다(Arch: portaudio).
# faster-whisper 는 첫 실행 시 base.en 모델(~140MB)을 자동 다운로드·캐시한다.

[tasks.voice-setup]
description = "음성 서비스 의존성 설치 (uv + voice/.venv) — 1회성"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$VOICE_DIR"
uv sync
echo "voice venv: $VOICE_DIR/.venv"
'''

[tasks.voice]
description = "음성 서비스 기동 (asyncio TCP :5000 + PTT 캡처). stdin JSON 입력 또는 `,` PTT"
# 통합 테스트(게임/봇/음성)에선 run-voice 로 부른다.
alias = "run-voice"
# .venv 는 git-ignore 라 새 worktree 엔 의존성이 없다 → 기동 전 설치 보장.
depends = ["voice-setup"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$VOICE_DIR"
uv run python -m voice_craft
'''

# voice-craft tasks / env
# 게임 측(bot) · 음성 측(voice) 공통 작업 진입점.
# 도구 버전 핀([tools])은 빌드 단계(A3~)에서 추가한다.

[env]
# BW 1.16.1 전용 Wine prefix. 모든 wine task가 상속한다.
# Wine 11+는 wow64 단일 빌드라 win32 prefix를 못 만든다 → win64로 두고
# wow64가 32-bit BW를 실행한다 (ADR-001).
WINEPREFIX = "{{env.HOME}}/.wine-bw"
WINEARCH = "win64"
# BW 패키지 압축 해제 위치.
BW_DIR = "{{env.HOME}}/sc-bw-1161"
# Wine virtual desktop 크기 (i3 윈도우 모드용).
# BW 1.16.1은 내부 렌더가 640x480 고정이라 창을 키워도 게임은 안 커지고 검은 여백만
# 늘어난다 → 창을 게임 크기에 맞춘다.
WINE_VDESKTOP = "640x480"

# --- A1: Wine + BW 1.16.1 (게임 확보 근거는 ADR-011) ---

[tasks.bw-download]
description = "BW 1.16.1 + BWAPI 4.4.0 패키지 다운로드·압축 해제 (멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p "$BW_DIR"
cd "$BW_DIR"
if [ ! -f scbw_bwapi440.zip ]; then
  curl -L -o scbw_bwapi440.zip \
    https://davechurchill.ca/starcraft/files/startcraft/scbw_bwapi440.zip
fi
if ! find . -iname StarCraft.exe -print -quit | grep -q .; then
  unzip -o scbw_bwapi440.zip
fi
echo "StarCraft.exe 위치:"
find "$BW_DIR" -iname StarCraft.exe
'''

[tasks.system-setup]
description = "Wine 등 시스템 패키지 설치 (sudo 필요 — '! mise run system-setup'으로 실행)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# [multilib]이 활성화되어 있어야 32-bit wine이 설치된다.
sudo pacman -S --needed wine wine-mono winetricks
'''

[tasks.wine-init]
description = "전용 WINEPREFIX 초기화 (win64/wow64, 멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ ! -d "$WINEPREFIX" ]; then
  wineboot --init
else
  echo "WINEPREFIX 이미 존재: $WINEPREFIX"
fi
'''

[tasks.wine-vdesktop]
description = "Wine virtual desktop 활성화 → BW를 i3가 다루는 윈도우 모드로 (멱등)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Explorer\Desktop = "Default" 로 두면 모든 wine 앱이 Default 가상 데스크톱 창에 뜬다.
# Desktops\Default 에 창 크기를 지정한다.
wine reg add 'HKCU\Software\Wine\Explorer' /v Desktop /d Default /f
wine reg add 'HKCU\Software\Wine\Explorer\Desktops' /v Default /d "$WINE_VDESKTOP" /f
echo "virtual desktop = $WINE_VDESKTOP"
'''

[tasks.bw-run]
description = "BW 단독 실행 → 메인 메뉴 확인 (A1 통과 조건)"
depends = ["bw-download", "wine-vdesktop"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
sc_dir=$(dirname "$(find "$BW_DIR" -iname StarCraft.exe -print -quit)")
cd "$sc_dir"
wine StarCraft.exe
'''

# --- A2: injectory로 BWAPI 인젝션 검증 (봇 없음, ADR-012) ---
# BWAPI 공식 배포는 ExampleAIModule 소스만 주고 빌드된 .dll이 없다 → A2는
# "Wine에서 BWAPI 주입 자체가 되는가"만 격리 검증한다. 실제 봇 동작은 A3.

[tasks.bw-bwapi]
description = "injectory로 BWAPI 주입해 BW 실행 → 크래시 없이 BWAPI 로드 확인 (A2 검증)"
depends = ["bw-download"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cd "$BW_DIR"
# injectory가 BWAPI.dll + WMode.dll 을 StarCraft.exe에 주입 (--verbose로 주입 로그).
# 봇은 bwapi.ini의 ai= 가 비어 있어 로드되지 않는다 (인젝션 자체만 검증).
# BWAPI 오버레이/로그는 매치 진입 후에 나타나므로 single-player 게임까지 들어가 확인.
wine injectory_x86.exe --verbose --launch StarCraft.exe \
  --inject bwapi-data/BWAPI.dll WMode.dll
'''
